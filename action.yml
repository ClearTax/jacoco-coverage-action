name: 'Parse jacoco report'
description: 'Parse jacoco report'
author: prajithp13
branding:
  icon: percent
  color: green
inputs:
  paths:
    description: "Path to JaCoCo report files (CSV or XML format)"
    default: "coverage/coverage.xml"
    required: true
  min-coverage:
    description: "The minimum code coverage that is required to pass for overall project"
    default: "90"
    required: false
  token:
    description: "Github PAT to create PR comments"
    required: true
  badgePath:
    description: "Path where badge will be generated"
    required: false
  report-url:
    description: "URL to the full coverage report"
    required: false
  base-ref:
    description: "Base branch to compare against for diff coverage (default: master)"
    default: "master"
    required: false
  source-dir:
    description: "Source code directory to match with JaCoCo report paths"
    default: "src"
    required: false
  use-git-diff:
    description: "Whether to use git diff for line-specific coverage analysis"
    default: "false"
    required: false
  use-xml:
    description: "Whether to use XML format for JaCoCo reports"
    default: "false"
    required: false
runs:
  using: 'node12'
  main: 'dist/index.js'

outputs:
  total-coverage:
    description: 'Total code coverage percentage'
  lines-covered:
    description: 'Total lines covered by tests'
  lines-missed:
    description: 'Total lines missed by tests'
  total-lines:
    description: 'Total number of lines'
  diff-coverage:
    description: 'Coverage percentage for changed lines'
  diff-lines-covered:
    description: 'Number of changed lines covered by tests'
  diff-lines-missed:
    description: 'Number of changed lines missed by tests'
  diff-total-lines:
    description: 'Total number of changed lines'
  line-specific-coverage:
    description: 'Coverage percentage for specific changed lines identified by git diff'
  line-specific-covered:
    description: 'Number of specific changed lines covered by tests'
  line-specific-missed:
    description: 'Number of specific changed lines missed by tests'
  line-specific-total:
    description: 'Total number of specific changed lines identified by git diff'
